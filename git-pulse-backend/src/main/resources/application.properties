# H2 Data Source (File-based with PostgreSQL compatibility and auto-table creation)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:file:./gitpulse-db/data;AUTO_SERVER=TRUE;MODE=PostgreSQL;INIT=CREATE TABLE IF NOT EXISTS repo_lookups (owner VARCHAR(255), repo VARCHAR(255), last_accessed TIMESTAMP, PRIMARY KEY (owner, repo))

# GitHub REST Client Configuration
quarkus.rest-client.github-api.url=https://api.github.com
github.token=${GITHUB_TOKEN}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000